name: Nightly beta

on:
  schedule:
    - cron: '45 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nightly-beta-release
  cancel-in-progress: false

jobs:
  tag:
    uses: RealWhyKnot/workflows/.github/workflows/nightly-beta-scripted.yml@v1
    with:
      runs-on: windows-2025-vs2026
      ci-workflow: ci.yml
      validate-scripts: |
        ./.github/scripts/Test-NightlyBetaPlan.ps1
