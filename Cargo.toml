[workspace]
resolver = "3"
members = ["crates/vrcim-core", "crates/vrcim-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-or-later"
publish = false

[workspace.lints.rust]
unknown_lints = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
self_named_module_files = "deny"
ref_option = "deny"
needless_pass_by_value = "deny"
fn_params_excessive_bools = "deny"
clone_on_ref_ptr = "deny"
redundant_clone = "deny"
match_wildcard_for_single_variants = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_lossless = "deny"
cast_precision_loss = "deny"
as_conversions = "deny"
map_err_ignore = "deny"
format_push_string = "deny"
needless_collect = "deny"
significant_drop_tightening = "deny"
manual_assert_eq = "deny"
assert_is_empty = "deny"
print_stdout = "deny"
print_stderr = "deny"

[workspace.dependencies]
anyhow = "1"
axum = "0.8.9"
base64 = "0.22"
gif = "0.14"
hex = "0.4"
image = { version = "0.25.6", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff"] }
jiff = "1.0.3"
lru = { version = "0.18", default-features = false }
mime_guess = "2"
num-traits = { version = "0.2.19", default-features = false, features = ["std"] }
pageframe = { git = "https://github.com/RealWhyKnot/Pageframe.git", rev = "309fd5784a8dea9811b2b4d1c1eaa3a8ca3e8895", default-features = false, features = ["gpu", "svg"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "multipart", "query"] }
rfd = { version = "0.17.1", default-features = false }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3.27"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "io-util", "signal"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "registry"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
vrcim-core = { path = "crates/vrcim-core" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_EventLog",
    "Win32_UI_Shell",
] }
winit = "=0.31.0-beta.4"
winresource = "0.1"
zip = { version = "9", default-features = false, features = ["deflate"] }

[patch.crates-io]
glifo = { git = "https://github.com/DioxusLabs/vello", rev = "be500db2b3a9cb3613de0e2c43f9358635c1f309" }
vello_common = { git = "https://github.com/DioxusLabs/vello", rev = "be500db2b3a9cb3613de0e2c43f9358635c1f309" }
vello_cpu = { git = "https://github.com/DioxusLabs/vello", rev = "be500db2b3a9cb3613de0e2c43f9358635c1f309" }
parley_engine = { git = "https://github.com/RealWhyKnot/Pageframe.git", rev = "309fd5784a8dea9811b2b4d1c1eaa3a8ca3e8895" }
parley = { git = "https://github.com/RealWhyKnot/Pageframe.git", rev = "309fd5784a8dea9811b2b4d1c1eaa3a8ca3e8895" }

[patch."https://github.com/DioxusLabs/anyrender"]
anyrender_vello = { git = "https://github.com/RealWhyKnot/Pageframe.git", rev = "309fd5784a8dea9811b2b4d1c1eaa3a8ca3e8895" }
anyrender_vello_cpu = { git = "https://github.com/RealWhyKnot/Pageframe.git", rev = "309fd5784a8dea9811b2b4d1c1eaa3a8ca3e8895" }

[profile.dev]
debug = 0

[profile.release]
lto = true
codegen-units = 1
strip = true
