name: Bug report
description: Something does not work
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: VRCInventoryManager version
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - Setup program
        - Zip
        - Built from source
    validations:
      required: false
  - type: textarea
    id: log
    attributes:
      label: Debug log
      description: Paste the relevant part of VRCInventoryManager.debug.log. Remove anything private.
      render: text
    validations:
      required: false
