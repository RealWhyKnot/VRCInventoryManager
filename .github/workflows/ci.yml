name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.github/release-template/**'
      - '.github/release-extras/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.github/release-template/**'
      - '.github/release-extras/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Repo checks
    permissions:
      contents: read
    uses: RealWhyKnot/workflows/.github/workflows/repo-checks.yml@v1

  shell:
    name: shell checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install shell tools
        shell: bash
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          shopt -s inherit_errexit
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt

      - name: Set up actionlint
        uses: raven-actions/actionlint@v2

      - name: Run shell gate
        shell: bash
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          shopt -s inherit_errexit
          bash .githooks/check-shell

  build:
    name: build, tests, and publish smoke
    runs-on: windows-2025-vs2026
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-PSResource -Name PSScriptAnalyzer -Version 1.25.0 -TrustRepository -Quiet

      - name: Run full gate
        shell: bash
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          shopt -s inherit_errexit
          timeout 600 pwsh -NoProfile -File .github/lint/lint.ps1

      - name: Publish app
        shell: pwsh
        run: |
          $publishArguments = @(
              'publish', 'src/VRCInventoryManager/VRCInventoryManager.csproj',
              '--configuration', 'Release', '--runtime', 'win-x64', '--self-contained', 'true', '--output', 'stage/app',
              '-p:PublishSingleFile=true', '-p:EnableCompressionInSingleFile=true',
              '-p:IncludeNativeLibrariesForSelfExtract=true', '-p:PublishReadyToRun=false',
              '-p:DebugType=None', '-p:DebugSymbols=false'
          )
          dotnet @publishArguments
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed with exit $LASTEXITCODE" }
          $files = @(Get-ChildItem stage/app -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'VRCInventoryManager.exe') {
              throw 'Publish output must contain exactly VRCInventoryManager.exe.'
          }

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: VRCInventoryManager-${{ github.sha }}
          path: stage/app
          if-no-files-found: error
          retention-days: 14
