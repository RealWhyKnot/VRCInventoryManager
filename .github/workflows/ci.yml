name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
      - ".github/release-template/**"
      - ".github/release-extras/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
      - ".github/release-template/**"
      - ".github/release-extras/**"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Repo checks
    permissions:
      contents: read
    uses: RealWhyKnot/workflows/.github/workflows/repo-checks.yml@v1

  native-style:
    name: Rust and shell style
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: RealWhyKnot/workflows/setup-rust@v1
        with:
          cache: "false"

      - name: Set up shell tools
        uses: RealWhyKnot/workflows/setup-shell-tools@v1

      - name: Set up lint tools
        uses: RealWhyKnot/workflows/setup-lint-tools@v1

      - name: Shell style
        run: bash .github/lint/check-shell

      - name: Rust style
        run: git ls-files -z -- '*.rs' | xargs -0 -r awk -f .github/lint/rust-style.awk

      - name: Dependency policy
        run: cargo deny --locked --workspace --config .github/lint/deny.toml check

  build:
    name: Windows checks and release build
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm

      - name: Set up Rust
        uses: RealWhyKnot/workflows/setup-rust@v1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"

      - name: Set up PSScriptAnalyzer
        uses: RealWhyKnot/workflows/setup-pssa@v1

      - name: Set up NSIS
        uses: RealWhyKnot/workflows/setup-nsis@v1
        with:
          version: "3.12"

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint and test
        run: ./.github/lint/lint.ps1

      - name: Build release packages
        run: ./build.ps1 -Release -RequireInstaller

      - name: Smoke-test the release executable
        run: ./.github/scripts/Test-ReleaseBinary.ps1

      - name: Upload release smoke artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: VRCInventoryManager-${{ github.sha }}
          path: |
            release/*.zip
            release/*Setup.exe
            release/*.integrity.tsv
            release/*.sha256
          if-no-files-found: error
          retention-days: 14
