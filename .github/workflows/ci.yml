name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.github/release-template/**'
      - '.github/release-extras/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.github/release-template/**'
      - '.github/release-extras/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Repo checks
    permissions:
      contents: read
    uses: RealWhyKnot/workflows/.github/workflows/repo-checks.yml@v1

  shell:
    name: shell checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up shell tools
        uses: RealWhyKnot/workflows/setup-shell-tools@v1
        with:
          actionlint: "1.7.12"

      - name: Run shell gate
        shell: bash
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          shopt -s inherit_errexit
          bash .githooks/check-shell

  build:
    name: build, tests, and publish smoke
    runs-on: windows-2025-vs2026
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Set up PSScriptAnalyzer
        uses: RealWhyKnot/workflows/setup-pssa@v1

      - name: Run full gate
        shell: bash
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          shopt -s inherit_errexit
          timeout 900 pwsh -NoProfile -File .github/lint/lint.ps1

      - name: Publish app
        shell: pwsh
        run: |
          $publishArguments = @(
              'publish', 'src/VRCInventoryManager/VRCInventoryManager.csproj',
              '--configuration', 'Release', '--runtime', 'win-x64', '--self-contained', 'true', '--output', 'stage/app',
              '-p:PublishSingleFile=true', '-p:EnableCompressionInSingleFile=true',
              '-p:IncludeNativeLibrariesForSelfExtract=true', '-p:PublishReadyToRun=false',
              '-p:DebugType=None', '-p:DebugSymbols=false'
          )
          dotnet @publishArguments
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed with exit $LASTEXITCODE" }
          $files = @(Get-ChildItem stage/app -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'VRCInventoryManager.exe') {
              throw 'Publish output must contain exactly VRCInventoryManager.exe.'
          }

      - name: Upload app artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: VRCInventoryManager-${{ github.sha }}
          path: stage/app
          if-no-files-found: error
          retention-days: 14
